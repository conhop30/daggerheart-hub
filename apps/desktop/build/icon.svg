<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262034" />
      <stop offset="1" stop-color="#14121b" />
    </linearGradient>
    <linearGradient id="tankard" x1="0" y1="106" x2="0" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0c866" />
      <stop offset="1" stop-color="#c99a34" />
    </linearGradient>
    <linearGradient id="mist" x1="128" y1="102" x2="128" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4b341" />
      <stop offset="0.55" stop-color="#b699d8" />
      <stop offset="1" stop-color="#8867d6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)" />

  <!-- Mist wisps, rising from the tankard's mouth -->
  <g fill="none" stroke-linecap="round">
    <path d="M118 100 C 100 84, 138 72, 118 56 C 102 43, 132 34, 122 22"
          stroke="url(#mist)" stroke-width="11" opacity="0.9" />
    <path d="M136 100 C 156 88, 122 74, 142 60 C 158 49, 130 40, 140 26"
          stroke="url(#mist)" stroke-width="8" opacity="0.65" />
    <path d="M127 100 C 112 90, 128 80, 118 68"
          stroke="url(#mist)" stroke-width="6" opacity="0.5" />
  </g>

  <!-- Tankard handle (dark outline stroke first, gold stroke on top) -->
  <path d="M 180 128 C 208 128, 214 148, 214 160 C 214 172, 208 192, 180 192"
        fill="none" stroke="#14121b" stroke-width="21" stroke-linecap="round" />
  <path d="M 180 128 C 208 128, 214 148, 214 160 C 214 172, 208 192, 180 192"
        fill="none" stroke="#c99a34" stroke-width="13" stroke-linecap="round" />

  <!-- Foam overflowing the rim -->
  <path d="M 84 104
           C 84 94, 94 90, 100 96
           C 104 86, 118 86, 122 96
           C 126 84, 142 84, 146 96
           C 152 88, 166 92, 164 104
           C 168 108, 166 116, 158 116
           L 92 116
           C 84 116, 80 108, 84 104 Z"
        fill="#f3ead9" stroke="#14121b" stroke-width="4" stroke-linejoin="round" />

  <!-- Tankard body -->
  <path d="M 90 116
           L 166 116
           L 176 192
           C 177 204, 167 213, 155 213
           L 101 213
           C 89 213, 79 204, 80 192
           Z"
        fill="url(#tankard)" stroke="#14121b" stroke-width="6" stroke-linejoin="round" />

  <!-- Bands -->
  <path d="M 84 146 L 172 146" stroke="#14121b" stroke-width="5" opacity="0.55" stroke-linecap="round" />
  <path d="M 82 178 L 174 178" stroke="#14121b" stroke-width="5" opacity="0.55" stroke-linecap="round" />
</svg>
