<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Daggerheart Brewery</title>
    <script>
      // Set the theme attribute before first paint so there's no flash of
      // the wrong theme — ThemeContext (which owns this logic for real,
      // including live system-preference changes) re-derives the same
      // value on mount, this just beats CSS to the first frame.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('daggerheart-theme-preference');
        } catch (e) {}
        var pref = stored === 'light' || stored === 'dark' ? stored : 'system';
        var resolved =
          pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
        document.documentElement.dataset.theme = resolved;
      })();
      // Same idea for the text-size preference (TextSizeContext) — beats
      // CSS to the first frame so there's no jump once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('daggerheart-text-size-preference');
          if (stored === 'small' || stored === 'normal' || stored === 'large') {
            document.documentElement.dataset.textSize = stored;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
