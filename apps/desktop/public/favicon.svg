<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241f45" />
      <stop offset="1" stop-color="#100e20" />
    </linearGradient>
    <linearGradient id="tankard" x1="60" y1="90" x2="160" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7986d4" />
      <stop offset="1" stop-color="#333a72" />
    </linearGradient>
    <linearGradient id="handle" x1="44" y1="140" x2="88" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b96de" />
      <stop offset="1" stop-color="#4a55a0" />
    </linearGradient>
    <linearGradient id="mist" x1="150" y1="80" x2="245" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c3a7c" />
      <stop offset="0.5" stop-color="#2f74b8" />
      <stop offset="1" stop-color="#82ecd6" />
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)" />

  <!-- Tankard body and handle, tipped toward the top right, pivoting near its base.
       The handle sits on the back-left side, opposite the pour, so it never
       competes with the mist below for the same space. -->
  <g transform="rotate(16 86 216)">
    <path d="M 86 140 C 52 140, 44 160, 44 175 C 44 190, 52 210, 88 212"
          fill="none" stroke="#14121f" stroke-width="22" stroke-linecap="round" />
    <path d="M 86 140 C 52 140, 44 160, 44 175 C 44 190, 52 210, 88 212"
          fill="none" stroke="url(#handle)" stroke-width="13" stroke-linecap="round" />
    <path d="M 86 90 L 190 90 L 180 220
             C 179 226, 170 231, 163 231
             L 108 231
             C 100 231, 92 226, 92 220 Z"
          fill="url(#tankard)" stroke="#14121f" stroke-width="6" stroke-linejoin="round" />
    <path d="M 88 138 L 186 132" stroke="#14121f" stroke-width="5" opacity="0.4" stroke-linecap="round" />
    <path d="M 89 182 L 183 177" stroke="#14121f" stroke-width="5" opacity="0.4" stroke-linecap="round" />
    <ellipse cx="138" cy="90" rx="54" ry="13" fill="#2a2760" stroke="#14121f" stroke-width="5" />
    <ellipse cx="138" cy="87" rx="46" ry="8" fill="#464483" opacity="0.6" />
  </g>

  <!-- Mist/liquid pouring from the tipped mouth, sweeping right then down the icon's right edge -->
  <g fill="none" stroke-linecap="round">
    <path d="M 172 100 C 204 90, 230 108, 224 140 C 220 172, 214 196, 236 250"
          stroke="url(#mist)" stroke-width="19" opacity="0.95" />
    <path d="M 166 114 C 190 110, 206 124, 200 148 C 196 176, 208 198, 202 222"
          stroke="url(#mist)" stroke-width="10" opacity="0.5" />
    <path d="M 178 96 C 198 88, 212 98, 208 114"
          stroke="url(#mist)" stroke-width="8" opacity="0.75" />
  </g>
</svg>
