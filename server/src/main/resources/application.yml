spring:
  application:
    name: daggerheart-hub

  datasource:
    # Lives outside the repo, in the user's home directory, so the working
    # database isn't accidentally committed or wiped by a git operation.
    url: "jdbc:sqlite:${user.home}/.daggerheart-hub/data.db"
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none   # schema is owned entirely by Flyway migrations, not Hibernate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8787

logging:
  level:
    org.flywaydb: DEBUG
